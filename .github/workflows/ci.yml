# Build the portfolio artifact and check the archived terminal application.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: typecheck earlier application
        run: npm run typecheck
      - name: lint authored source
        run: npm run lint
      - name: existing unit suite
        run: npm run test
      - name: build Vercel artifact
        run: npm run build:vercel
