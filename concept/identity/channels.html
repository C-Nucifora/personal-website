<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Christian Nucifora: engineering and computer science student, UQ Racing perception and electrical, software projects."
    />
    <title>Christian Nucifora</title>
    <link rel="stylesheet" href="channels.css" />
    <script>
      document.documentElement.classList.add("js");
    </script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <header class="top">
      <a class="mark" href="#main">Christian Nucifora</a>
      <nav aria-label="Primary">
        <ul>
          <li><a href="#log">Timeline</a></li>
          <li><a href="#work">Work</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main id="main">
      <section class="intro" aria-labelledby="name">
        <h1 id="name">Christian Nucifora</h1>
        <p class="intro-text" data-slot="oneLine"></p>
      </section>

      <section
        class="log"
        id="log"
        aria-labelledby="log-h"
        data-slot="log"
      ></section>

      <section class="work" id="work" aria-labelledby="work-h">
        <h2 id="work-h">Work</h2>
        <div class="viewer">
          <nav class="tabs" aria-label="Projects" data-slot="tabs"></nav>
          <div class="detail" data-slot="panels"></div>
        </div>
        <div class="smaller">
          <h3>Smaller things</h3>
          <ul data-slot="smaller"></ul>
        </div>
      </section>

      <section class="about" id="about" aria-labelledby="about-h">
        <h2 id="about-h">About</h2>
        <div class="about-text" data-slot="intro"></div>
      </section>

      <section class="contact" id="contact" aria-labelledby="contact-h">
        <h2 id="contact-h">Contact</h2>
        <p data-slot="email"></p>
        <ul class="elsewhere" data-slot="elsewhere"></ul>
      </section>
    </main>

    <footer class="foot">
      <p>
        Project notes and flows summarise each README at the linked revision.
      </p>
      <p data-preview-only><a href="index.html">Both directions</a></p>
    </footer>

    <noscript data-preview-only
      ><p class="noscript">
        This preview renders its content with JavaScript. Run
        <code>npm run build:identity</code> for static pages.
      </p></noscript
    >
    <script src="content.js"></script>
    <script src="views.js"></script>
    <script src="channels.js"></script>
  </body>
</html>
